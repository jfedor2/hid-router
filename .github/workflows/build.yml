name: build

on:
  push:
  workflow_call:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: true
    - run: cmake -B build
    - run: cmake --build build --config Release
    - uses: actions/upload-artifact@v7
      with:
        name: any2xinput
        path: build/Release/any2xinput.exe
    - uses: actions/upload-artifact@v7
      with:
        name: sdl-transmitter
        path: build/Release/sdl-transmitter.exe
    - uses: actions/upload-artifact@v7
      with:
        name: any2flex
        path: build/Release/any2flex.exe
